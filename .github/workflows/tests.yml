name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements_dev.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy custom_components/gmx_mail
      - name: Integration tests
        run: pytest -q --cov=custom_components.gmx_mail --cov-report=term-missing
      - name: Probe script tests
        run: pytest -q -p no:homeassistant tests/probe

  server-tests:
    # Read path, IDLE and polling against real IMAP servers: GreenMail and a GMX-like Dovecot (TLS with a test CA).
    # Never a real mail account.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements_dev.txt
      - name: Test certificates and servers
        run: |
          python tools/make_test_certs.py
          docker compose up -d greenmail dovecot
      - name: Wait for the servers
        run: python tools/wait_for_test_servers.py greenmail dovecot
      - name: Server tests
        env:
          REQUIRE_GREENMAIL: "1"
          REQUIRE_DOVECOT: "1"
        run: pytest -q -p no:homeassistant -m integration tests/integration
      - name: Server logs on failure
        if: failure()
        run: docker compose logs greenmail dovecot

  staging:
    # End-to-end in the real Home Assistant target version (container) through its REST/WebSocket APIs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements_dev.txt
      - name: ha-mcp in its own environment (as in production; its dependencies must not mix with HA's)
        run: |
          python -m venv /tmp/ha-mcp
          /tmp/ha-mcp/bin/pip install ha-mcp==9.2.0
      - name: Test certificates, wheel, containers
        run: |
          python tools/make_test_certs.py
          pip download --no-deps -d tests/staging/wheels imapclient==4.3.0
          docker compose up -d greenmail dovecot
          docker compose --profile staging up -d --build homeassistant
      - name: Wait for the mail server
        run: python tools/wait_for_test_servers.py greenmail dovecot
      - name: Staging test
        env:
          REQUIRE_STAGING: "1"
          REQUIRE_HA_MCP: "1"
          HA_MCP_BIN: /tmp/ha-mcp/bin/ha-mcp
        run: pytest -q -p no:homeassistant -m staging tests/staging
      - name: Home Assistant log on failure
        if: failure()
        run: docker compose --profile staging logs homeassistant dovecot
