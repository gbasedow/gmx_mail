list_folders:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gmx_mail
    include_counts:
      default: false
      selector:
        boolean:

search:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gmx_mail
    folder:
      default: INBOX
      example: INBOX
      selector:
        text:
    from:
      selector:
        text:
    to:
      selector:
        text:
    cc:
      selector:
        text:
    subject:
      selector:
        text:
    text:
      selector:
        text:
    body:
      selector:
        text:
    since:
      selector:
        date:
    before:
      selector:
        date:
    seen:
      selector:
        boolean:
    flagged:
      selector:
        boolean:
    answered:
      selector:
        boolean:
    draft:
      selector:
        boolean:
    larger:
      selector:
        number:
          min: 0
          max: 1000000000
          mode: box
          unit_of_measurement: B
    smaller:
      selector:
        number:
          min: 1
          max: 1000000000
          mode: box
          unit_of_measurement: B
    keyword:
      selector:
        text:
    uid_range:
      example: "100:200"
      selector:
        text:
    sort:
      default: date_desc
      selector:
        select:
          translation_key: sort
          options:
            - date_desc
            - date_asc
    limit:
      default: 20
      selector:
        number:
          min: 1
          max: 50
          mode: box
    cursor:
      selector:
        text:
    include_snippet:
      default: false
      selector:
        boolean:

get_message:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gmx_mail
    ref:
      required: true
      example: '{"folder": "INBOX", "uid": 123, "uidvalidity": 456}'
      selector:
        object:
    format:
      default: text
      selector:
        select:
          translation_key: body_format
          options:
            - text
            - html_as_text
            - html
            - raw_headers
    max_chars:
      default: 8000
      selector:
        number:
          min: 100
          max: 32000
          mode: box
    offset:
      default: 0
      selector:
        number:
          min: 0
          max: 100000000
          mode: box
    headers:
      selector:
        text:
          multiple: true

get_attachment:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gmx_mail
    ref:
      required: true
      example: '{"folder": "INBOX", "uid": 123, "uidvalidity": 456}'
      selector:
        object:
    part_id:
      required: true
      example: "2"
      selector:
        text:
    mode:
      default: save
      selector:
        select:
          translation_key: attachment_mode
          options:
            - save
            - base64
    max_bytes:
      default: 10485760
      selector:
        number:
          min: 1
          max: 52428800
          mode: box
          unit_of_measurement: B

get_status:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gmx_mail

get_audit_log:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gmx_mail
    limit:
      default: 50
      selector:
        number:
          min: 1
          max: 200
          mode: box

set_flags:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gmx_mail
    refs:
      required: true
      example: '[{"folder": "INBOX", "uid": 123, "uidvalidity": 456}]'
      selector:
        object:
    add:
      example: '["seen", "$Steuer"]'
      selector:
        text:
          multiple: true
    remove:
      selector:
        text:
          multiple: true

move:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gmx_mail
    refs:
      required: true
      example: '[{"folder": "INBOX", "uid": 123, "uidvalidity": 456}]'
      selector:
        object:
    target_folder:
      required: true
      example: Archiv
      selector:
        text:

copy:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gmx_mail
    refs:
      required: true
      example: '[{"folder": "INBOX", "uid": 123, "uidvalidity": 456}]'
      selector:
        object:
    target_folder:
      required: true
      example: Archiv
      selector:
        text:

mark_spam:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gmx_mail
    refs:
      required: true
      example: '[{"folder": "INBOX", "uid": 123, "uidvalidity": 456}]'
      selector:
        object:

mark_not_spam:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gmx_mail
    refs:
      required: true
      example: '[{"folder": "Spamverdacht", "uid": 7, "uidvalidity": 456}]'
      selector:
        object:

create_folder:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gmx_mail
    name:
      required: true
      example: "2026"
      selector:
        text:
    parent:
      example: Rechnungen
      selector:
        text:

rename_folder:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gmx_mail
    path:
      required: true
      example: Rechnungen/2026
      selector:
        text:
    new_name:
      required: true
      example: "2026 erledigt"
      selector:
        text:

save_draft:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gmx_mail
    to:
      selector:
        text:
          multiple: true
          type: email
    cc:
      selector:
        text:
          multiple: true
          type: email
    bcc:
      selector:
        text:
          multiple: true
          type: email
    subject:
      selector:
        text:
    body_text:
      selector:
        text:
          multiline: true
    body_html:
      selector:
        text:
          multiline: true
    in_reply_to_ref:
      selector:
        object:

trash:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gmx_mail
    refs:
      required: true
      example: '[{"folder": "INBOX", "uid": 123, "uidvalidity": 456}]'
      selector:
        object:

delete_permanently:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gmx_mail
    refs:
      required: true
      example: '[{"folder": "Gelöscht", "uid": 123, "uidvalidity": 456}]'
      selector:
        object:
    confirm_token:
      selector:
        text:

delete_folder:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: gmx_mail
    path:
      required: true
      example: Archiv/Alt
      selector:
        text:
    confirm_token:
      selector:
        text:
