# Test servers - never a real mail account.
#   docker compose up -d greenmail dovecot          -> pytest -p no:homeassistant -m integration tests/integration
#   docker compose --profile staging up -d          -> pytest -p no:homeassistant -m staging tests/staging
# Before the first start: python3 tools/make_test_certs.py (test CA for Dovecot, git-ignored)
# and, for staging, the imapclient wheel: see tests/staging/README.md.
services:
  greenmail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=test:secret@example.test -Dgreenmail.users.login=email
    ports:
      - "3143:3143"
      - "3025:3025"

  dovecot:
    # GMX-like: GMX capabilities, Gesendet/Entwürfe/Gelöscht/Spamverdacht with SPECIAL-USE, TLS only (test CA).
    image: dovecot/dovecot:2.4.1
    environment:
      USER_PASSWORD: secret
    volumes:
      - ./tests/integration/certs:/etc/dovecot/ssl:ro
      - ./tests/integration/dovecot/gmx.conf:/etc/dovecot/conf.d/gmx.conf:ro
    ports:
      - "31993:31993"
      - "31143:31143"
      - "31587:31587"

  homeassistant:
    # Staging: real Home Assistant (target version) with the integration, talking to the Dovecot test server.
    profiles: ["staging"]
    build:
      context: ./tests/staging
    image: gmx_mail-staging:2026.11.2
    environment:
      REQUESTS_CA_BUNDLE: /certs/ca.crt  # HA's TLS context trusts only the test CA (staging only)
      TZ: Europe/Berlin
    volumes:
      - ./custom_components:/config/custom_components:ro
      - ./tests/staging/config/configuration.yaml:/config/configuration.yaml:ro
      - ./tests/integration/certs:/certs:ro
    ports:
      - "8123:8123"
    depends_on:
      - dovecot
