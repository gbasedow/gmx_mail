name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements_dev.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy custom_components/gmx_mail
      - name: Integration tests
        run: pytest -q --cov=custom_components.gmx_mail --cov-report=term-missing
      - name: Probe script tests
        run: pytest -q -p no:homeassistant tests/probe
