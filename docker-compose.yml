# Test servers for `pytest -p no:homeassistant -m integration tests/integration` (never a real account).
services:
  greenmail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=test:secret@example.test -Dgreenmail.users.login=email
    ports:
      - "3143:3143"
      - "3025:3025"
